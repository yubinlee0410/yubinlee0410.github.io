<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>이력 · 연락처 — 이유빈 (Yu-Bin Lee)</title>
<meta name="description" content="이유빈의 학력·경력 이력과 연락처. 면역세포 중심 생리학 전공, 호중구 연구.">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opt@1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  /* publications.js·site.js 를 항상 최신본으로 로드 (브라우저 캐시로 인한 반영 지연 방지) */
  (function () { var v = '?v=' + Date.now();
    document.write('<script src="publications.js' + v + '"><\/script>');
    document.write('<script src="site.js' + v + '"><\/script>');
  })();
</script>
</head>

<body data-page="cv" class="font-sans text-ink bg-wash">

<div data-bind="site-nav"></div>

<main class="max-w-content mx-auto px-6 md:px-8 py-16 md:py-24">
  <div class="mb-11">
    <div class="text-[13px] font-bold tracking-[.12em] uppercase text-purple">Curriculum Vitae</div>
    <h1 class="text-[30px] md:text-[34px] font-bold tracking-[-.02em] mt-2">이력 · 연락처</h1>
  </div>
  <div class="grid lg:grid-cols-[1.2fr_.8fr] gap-9 lg:gap-14">
    <div class="timeline" data-bind="timeline"></div>
    <div class="bg-white border border-line rounded-[18px] px-7 py-8 h-fit">
      <h3 class="text-[19px] font-bold mb-1" data-bind="contactTitle"></h3>
      <p class="text-[14px] text-ink-soft mb-5" data-bind="contactSub"></p>
      <div data-bind="contactRows"></div>
    </div>
  </div>
</main>

<div data-bind="site-footer"></div>

</body>
</html>
