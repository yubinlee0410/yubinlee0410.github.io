name: Update publications (citations & metadata)

on:
  schedule:
    - cron: "17 3 * * 1"   # 매주 월요일 03:17 UTC 자동 실행
  workflow_dispatch: {}      # 수동 실행 버튼

permissions:
  contents: write

concurrency:
  group: update-publications
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Update publications.js from OpenAlex
        run: node scripts/update-publications.mjs

      - name: Commit if changed
        run: |
          if [[ -n "$(git status --porcelain publications.js)" ]]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add publications.js
            git commit -m "chore: auto-update publication citations & metadata (OpenAlex)"
            git push
            echo "publications.js updated and pushed."
          else
            echo "No changes to publications.js."
          fi
