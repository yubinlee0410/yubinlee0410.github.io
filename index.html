<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>이유빈 (Yu-Bin Lee) — 호중구 면역 연구</title>
<meta name="description" content="면역세포 중심 생리학 전공, 호중구(Neutrophil) 중심 연구. 사람 말초혈액 면역세포와 단일세포 RNA 시퀀싱으로 질환별 호중구 기능 변화를 연구합니다.">
<meta name="author" content="Yu-Bin Lee">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opt@1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.tailwindcss.com"></script>
<script src="publications.js"></script>
<script src="site.js"></script>
</head>

<body data-page="home" class="font-sans text-ink bg-white">

<!-- 내비게이션 (site.js가 채움) -->
<div data-bind="site-nav"></div>

<!-- HERO -->
<div class="relative overflow-hidden">
  <svg class="hidden md:block absolute right-[-60px] top-[-40px] w-[420px] opacity-50 pointer-events-none" viewBox="0 0 400 300" fill="none">
    <path d="M20 40 C120 20 180 120 300 90 M20 90 C120 70 180 170 300 140 M20 140 C120 120 180 220 300 190" stroke="#c4b5fd" stroke-width="1.4"/>
    <g stroke="#ddd6fe" stroke-width="1">
      <line x1="60" y1="30" x2="66" y2="95"/><line x1="110" y1="55" x2="118" y2="120"/>
      <line x1="170" y1="112" x2="176" y2="178"/><line x1="240" y1="98" x2="248" y2="162"/>
    </g>
    <g fill="#a78bfa"><circle cx="60" cy="30" r="3"/><circle cx="118" cy="120" r="3"/><circle cx="240" cy="98" r="3"/><circle cx="176" cy="178" r="3"/></g>
  </svg>

  <div class="max-w-content mx-auto px-6 md:px-8 py-16 md:py-20 grid lg:grid-cols-[1.35fr_.9fr] gap-10 lg:gap-14 items-center">
    <div>
      <span class="inline-flex items-center gap-2 text-[13px] font-semibold text-purple bg-wash border border-line px-3.5 py-1.5 rounded-full tracking-wide">
        <span class="w-[7px] h-[7px] rounded-full bg-purple-2"></span><span data-bind="eyebrow"></span>
      </span>
      <h1 class="text-[52px] md:text-[72px] leading-[1.08] tracking-[-.025em] font-bold text-purple mt-5 mb-1.5" data-bind="nameEn"></h1>
      <p class="text-[16px] md:text-[17px] text-ink-soft mt-4 max-w-[34em]" data-bind="heroRole"></p>
      <div class="flex flex-wrap gap-3.5 mt-8">
        <a class="inline-flex items-center gap-2 text-[14.5px] font-semibold px-5 py-3 rounded-[11px] bg-purple text-white hover:bg-purple-ink hover:-translate-y-px transition" href="research.html">연구 살펴보기 →</a>
        <a class="inline-flex items-center gap-2 text-[14.5px] font-semibold px-5 py-3 rounded-[11px] border border-line text-ink hover:border-purple-2 hover:text-purple transition" href="cv.html">CV · 연락처</a>
      </div>
    </div>

    <aside class="relative border border-line rounded-[20px] p-4 shadow-portrait bg-gradient-to-b from-white to-wash">
      <div class="rounded-[14px] relative overflow-hidden px-6 py-7 md:px-7 md:py-8" style="background:radial-gradient(130% 130% at 15% 0%, #ede9fe 0%, #f5f3ff 45%, #fff 100%)">
        <div class="text-[18px] font-semibold tracking-tight text-purple-ink leading-[1.55]" data-bind="heroQuote"></div>
        <div class="flex gap-4 mt-6 pt-5 border-t border-line" data-bind="heroStats"></div>
      </div>
      <div class="px-1.5 pt-3 pb-1 text-[12.5px] text-ink-soft" data-bind="heroCaption"></div>
    </aside>
  </div>
</div>

<!-- ABOUT -->
<section id="about" class="py-20 md:py-24 border-t border-line bg-white">
  <div class="max-w-content mx-auto px-6 md:px-8">
    <div class="mb-11">
      <div class="text-[13px] font-bold tracking-[.12em] uppercase text-purple">About</div>
      <h2 class="text-[30px] font-bold tracking-[-.02em] mt-2">소개</h2>
    </div>
    <div class="grid md:grid-cols-2 gap-8 md:gap-12">
      <div class="text-ink-soft space-y-4" data-bind="aboutParagraphs"></div>
      <div class="facts flex flex-col border-l-2 border-purple-2 pl-6" data-bind="aboutFacts"></div>
    </div>
    <div class="mt-12 flex flex-wrap gap-3.5">
      <a class="inline-flex items-center gap-2 text-[14.5px] font-semibold px-5 py-3 rounded-[11px] bg-purple text-white hover:bg-purple-ink hover:-translate-y-px transition" href="research.html">연구 주제 →</a>
      <a class="inline-flex items-center gap-2 text-[14.5px] font-semibold px-5 py-3 rounded-[11px] border border-line text-ink hover:border-purple-2 hover:text-purple transition" href="publications.html">논문 목록 →</a>
    </div>
  </div>
</section>

<!-- 푸터 (site.js가 채움) -->
<div data-bind="site-footer"></div>

</body>
</html>
